name: Deploy NUSA DESIGN preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static preview
        run: npm run build
        env:
          VITE_AI_API_URL: ${{ vars.VITE_AI_API_URL }}
          VITE_NEON_AUTH_URL: ${{ vars.VITE_NEON_AUTH_URL || 'https://ep-rapid-rice-b49xojtk.neonauth.c-6.us-east-2.aws.neon.tech/neondb/auth' }}
          VITE_HR_API_BASE_URL: ${{ vars.VITE_HR_API_BASE_URL || 'https://br-wispy-feather-b4t2xxmn-hrapi.compute.c-6.us-east-2.aws.neon.tech' }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live frontend and production API
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          API_URL: https://br-wispy-feather-b4t2xxmn-hrapi.compute.c-6.us-east-2.aws.neon.tech
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 5 "$SITE_URL" -o /tmp/nusa-design.html
          grep -q 'id="root"' /tmp/nusa-design.html
          grep -q '/NUSA-DESAIN/assets/' /tmp/nusa-design.html
          curl --fail --silent --show-error "$API_URL/health" | jq -e '.data.status == "ok" and .data.service == "nusa-design-api"'
          curl --fail --silent --show-error "$API_URL/ready" | jq -e '.data.status == "ready" and .data.service == "nusa-design-api"'
          echo "Live Pages and production API health/readiness checks passed."
